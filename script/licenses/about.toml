# cargo-about configuration for script/generate-licenses.
no-clearly-defined = true
private = { ignore = true }
# The targets build.yml ships. Crates only other targets pull in (iroh's wasm transport)
# are not in any Condr binary, so they are not listed.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Licenses allowed in Condr's dependencies.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "NCSA",
    "CDLA-Permissive-2.0",
    "0BSD",
    "bzip2-1.0.6",
]
