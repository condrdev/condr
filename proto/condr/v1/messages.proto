// Everything after Welcome (ADR 0028). Each frame is one ClientMessage or ServerMessage.
// Fields and oneof members are only added; a Server never sends a Client a member newer
// than the Client's protocol, and a Client never sends one newer than the Server's.
syntax = "proto3";

package condr.v1;

import "condr/v1/handshake.proto";
import "condr/v1/session.proto";
import "condr/v1/terminal.proto";

message ClientMessage {
  oneof message {
    SessionRequest snapshot_request = 1;
    SessionRequest overview_request = 2;
    Subscribe subscribe = 3;
    Ping ping = 4;
    SessionRequest acquire_control = 5;
    SessionRequest release_control = 6;
    LayoutRequest layout = 7;
    TerminalRequest terminal = 8;
    PasteImage paste_image = 9;
    ReadPane read_pane = 10;
    GitDiffRequest git_diff = 11;
    PathRequest list_directory = 12;
    PathRequest read_file = 13;
    AgentRequest agent = 14;
    SetServerSettings set_server_settings = 15;
    ServerRequest stop_server = 16;
    RevokeDevice revoke_device = 17;
    Empty connected_devices = 18;
    ServerAdminRequest server_admin = 19;
    Empty detach = 20;
    BrowseDirectory browse_directory = 21;
  }
}

message SessionRequest {
  uint64 session_id = 1;
}

message ServerRequest {
  uint64 server_id = 1;
}

message Subscribe {
  uint64 session_id = 1;
  uint64 after_sequence = 2;
}

message Ping {
  uint64 server_id = 1;
  uint64 nonce = 2;
}

message LayoutRequest {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint64 request_id = 3;
  LayoutCommand command = 4;
}

message TerminalRequest {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint64 pane_id = 3;
  TerminalCommand command = 4;
}

// No fallback.
enum ClipboardImageFormat {
  CLIPBOARD_IMAGE_FORMAT_UNSPECIFIED = 0;
  CLIPBOARD_IMAGE_FORMAT_PNG = 1;
  CLIPBOARD_IMAGE_FORMAT_JPEG = 2;
  CLIPBOARD_IMAGE_FORMAT_GIF = 3;
  CLIPBOARD_IMAGE_FORMAT_WEBP = 4;
  CLIPBOARD_IMAGE_FORMAT_BMP = 5;
}

message PasteImage {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint64 pane_id = 3;
  ClipboardImageFormat format = 4;
  bytes bytes = 5;
}

message ReadPane {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint64 pane_id = 3;
  uint32 lines = 4;
}

// No fallback.
enum DiffBase {
  DIFF_BASE_UNSPECIFIED = 0;
  DIFF_BASE_HEAD = 1;
}

message GitDiffRequest {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint64 request_id = 3;
  uint64 workspace_id = 4;
  string path = 5;
  DiffBase against = 6;
}

message PathRequest {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint64 request_id = 3;
  uint64 workspace_id = 4;
  string path = 5;
}

// An absolute path on the Server's machine; empty for its home directory.
message BrowseDirectory {
  uint64 request_id = 1;
  string path = 2;
}

message AgentRequest {
  uint64 server_id = 1;
  uint64 session_id = 2;
  AgentCommand command = 3;
}

message SetServerSettings {
  uint64 server_id = 1;
  string shell = 2;
}

message RevokeDevice {
  string key = 1;
}

message ServerAdminRequest {
  uint64 server_id = 1;
  ServerAdminCommand command = 2;
}

message ServerAdminCommand {
  oneof command {
    Empty status = 1;
    SaveListen save_listen = 2;
    bool save_p2p = 3;
    Empty restart = 4;
    Empty clients = 5;
    Empty invite = 6;
    string revoke = 7;
  }
}

message SaveListen {
  optional string address = 1;
}

message AgentCommand {
  oneof command {
    Empty available = 1;
    Empty list = 2;
    AgentStart start = 3;
    AgentPrompt prompt = 4;
    AgentWait wait = 5;
    AgentHooks hooks = 6;
  }
}

message AgentStart {
  string name = 1;
  AgentKind kind = 2;
  uint64 pane_id = 3;
  repeated string args = 4;
  uint64 timeout_ms = 5;
}

message AgentStates {
  repeated AgentState states = 1;
}

message AgentPrompt {
  string target = 1;
  string text = 2;
  // Unset waits for the default settled states.
  AgentStates until = 3;
  uint64 timeout_ms = 4;
}

message AgentWait {
  string target = 1;
  repeated AgentState until = 2;
  uint64 timeout_ms = 3;
}

message AgentHooks {
  AgentKind agent = 1;
  HooksAction action = 2;
}

message LayoutCommand {
  oneof command {
    CreateWorkspace create_workspace = 1;
    CreateWorktree create_worktree = 2;
    OpenWorktree open_worktree = 3;
    WorkspaceTarget remove_worktree = 4;
    CreateTab create_tab = 5;
    RenameWorkspace rename_workspace = 6;
    RenameTab rename_tab = 7;
    WorkspaceTarget activate_workspace = 8;
    TabTarget activate_tab = 9;
    MoveWorkspace move_workspace = 10;
    MoveTab move_tab = 11;
    SplitPane split_pane = 12;
    PaneTarget focus_pane = 13;
    PaneInDirection focus_pane_direction = 14;
    ResizePane resize_pane = 15;
    SetSplitRatios set_split_ratios = 16;
    PaneInDirection swap_pane = 17;
    SwapPanes swap_panes = 18;
    MovePane move_pane = 19;
    PaneTarget toggle_pane_zoom = 20;
    PaneTarget close_pane = 21;
    TabTarget close_tab = 22;
    WorkspaceTarget close_workspace = 23;
    WorkspacePath show_diff = 24;
    WorkspacePath show_file = 25;
  }
}

message WorkspaceTarget {
  uint64 workspace_id = 1;
}

message TabTarget {
  uint64 tab_id = 1;
}

message PaneTarget {
  uint64 pane_id = 1;
}

message CreateWorkspace {
  string root_directory = 1;
  optional string name = 2;
}

message CreateWorktree {
  uint64 parent_workspace_id = 1;
  string branch = 2;
}

message OpenWorktree {
  uint64 parent_workspace_id = 1;
  string root_directory = 2;
}

message CreateTab {
  uint64 workspace_id = 1;
  optional string name = 2;
  optional uint64 cwd_from = 3;
}

message RenameWorkspace {
  uint64 workspace_id = 1;
  string name = 2;
}

message RenameTab {
  uint64 tab_id = 1;
  string name = 2;
}

message MoveWorkspace {
  uint64 workspace_id = 1;
  uint32 target_index = 2;
}

message MoveTab {
  uint64 tab_id = 1;
  uint32 target_index = 2;
}

message SplitPane {
  uint64 pane_id = 1;
  SplitDirection direction = 2;
  bool focus = 3;
}

message PaneInDirection {
  uint64 pane_id = 1;
  PaneDirection direction = 2;
}

message ResizePane {
  uint64 pane_id = 1;
  PaneDirection direction = 2;
  float amount = 3;
}

message SetSplitRatios {
  uint64 tab_id = 1;
  repeated float ratios = 2;
}

message SwapPanes {
  uint64 pane_id = 1;
  uint64 other = 2;
}

message MovePane {
  uint64 pane_id = 1;
  uint64 target_pane_id = 2;
  PaneDirection side = 3;
}

message WorkspacePath {
  uint64 workspace_id = 1;
  string path = 2;
}

message ServerMessage {
  oneof message {
    BootstrapHeader bootstrap = 1;
    SessionOverview overview = 2;
    OverviewTerminals overview_terminals = 3;
    BootstrapBatch bootstrap_batch = 4;
    SessionSequence subscribed = 5;
    SessionReason snapshot_rejected = 6;
    SessionReason subscription_rejected = 7;
    SessionEventMessage event = 8;
    TerminalFrameBatch terminal_frame = 9;
    TerminalFrameChunk terminal_frame_chunk = 10;
    Pong pong = 11;
    SessionAddress control_granted = 12;
    SessionAddress control_released = 13;
    SessionReason control_denied = 14;
    LayoutRejected layout_rejected = 15;
    LayoutApplied layout_applied = 16;
    TerminalCopied terminal_copied = 17;
    PaneText pane_text = 18;
    GitDiffReply git_diff = 19;
    DirectoryReply directory = 20;
    FileContentReply file_content = 21;
    AgentResult agent_result = 22;
    PaneText terminal_clipboard = 23;
    Empty server_stopping = 24;
    uint32 devices_revoked = 25;
    ConnectedDevices connected_devices = 26;
    ServerAdminResponse server_admin = 27;
    string error = 28;
    BrowsedDirectoryReply browsed_directory = 29;
  }
}

message SessionAddress {
  uint64 server_id = 1;
  uint64 session_id = 2;
}

message SessionSequence {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint64 sequence = 3;
}

message SessionReason {
  uint64 server_id = 1;
  uint64 session_id = 2;
  string reason = 3;
}

// 16 bytes, big-endian.
message RuntimeEpoch {
  bytes value = 1;
}

message ServerSettings {
  string shell = 1;
  string default_shell = 2;
}

message BootstrapHeader {
  uint64 server_id = 1;
  RuntimeEpoch runtime_epoch = 2;
  uint64 session_id = 3;
  uint64 sequence = 4;
  SessionSnapshot snapshot = 5;
  ServerSettings settings = 6;
  uint32 batch_count = 7;
}

message PaneTerminalMetadata {
  uint64 pane_id = 1;
  optional string title = 2;
  bool exited = 3;
}

message PaneAgentSnapshot {
  uint64 pane_id = 1;
  AgentSnapshot agent = 2;
}

message SessionOverview {
  uint64 server_id = 1;
  RuntimeEpoch runtime_epoch = 2;
  uint64 session_id = 3;
  uint64 sequence = 4;
  SessionSnapshot snapshot = 5;
  repeated PaneTerminalMetadata terminals = 6;
  repeated PaneAgentSnapshot agents = 7;
  repeated uint64 zoomed_panes = 8;
}

message OverviewTerminals {
  uint64 server_id = 1;
  uint64 session_id = 2;
  repeated PaneTerminalMetadata terminals = 3;
}

message BootstrapBatch {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint32 batch_index = 3;
  uint32 record_index = 4;
  uint32 chunk_index = 5;
  uint32 chunk_count = 6;
  bytes payload = 7;
}

message PaneTerminalSnapshot {
  uint64 pane_id = 1;
  TerminalView view = 2;
  bool exited = 3;
  optional string title = 4;
  bool attention = 5;
}

message WorkspaceGitSnapshot {
  uint64 workspace_id = 1;
  optional string branch = 2;
  bool linked_worktree = 3;
  GitUpstream upstream = 4;
  GitChanges changes = 5;
}

// One chunked Bootstrap record. A record of a kind this build does not know is skipped.
message BootstrapRecord {
  oneof record {
    PaneTerminalSnapshot terminal = 1;
    PaneAgentSnapshot agent = 2;
    WorkspaceGitSnapshot workspace_git = 3;
    uint64 zoomed_pane = 4;
  }
}

message PaneTerminalFrame {
  uint64 pane_id = 1;
  TerminalViewFrame frame = 2;
}

message TerminalFrameBatch {
  uint64 server_id = 1;
  uint64 session_id = 2;
  repeated PaneTerminalFrame panes = 3;
}

message TerminalFrameChunk {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint64 pane_id = 3;
  uint64 revision = 4;
  uint32 chunk_index = 5;
  uint32 chunk_count = 6;
  bytes payload = 7;
}

message SessionEventMessage {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint64 sequence = 3;
  SessionEvent event = 4;
}

message SessionEvent {
  oneof event {
    LayoutChanged layout_changed = 1;
    PaneTarget terminal_exited = 2;
    AgentChanged agent_changed = 3;
    WorkspaceGitChanged workspace_git_changed = 4;
    WorkspaceTarget workspace_files_changed = 5;
    TerminalTitleChanged terminal_title_changed = 6;
    TerminalAttentionChanged terminal_attention_changed = 7;
    ServerSettings server_settings_changed = 8;
    Activated activated = 9;
    // An event this Client's protocol does not include, sent in its place so the
    // sequence stays contiguous (ADR 0028).
    Empty omitted = 10;
  }
}

message LayoutChanged {
  SessionSnapshot snapshot = 1;
  repeated uint64 zoomed_panes = 2;
}

message AgentChanged {
  uint64 pane_id = 1;
  AgentSnapshot agent = 2;
}

message WorkspaceGitChanged {
  uint64 workspace_id = 1;
  WorkspaceGitSnapshot git = 2;
}

message TerminalTitleChanged {
  uint64 pane_id = 1;
  optional string title = 2;
}

message TerminalAttentionChanged {
  uint64 pane_id = 1;
  bool attention = 2;
}

message Activated {
  uint64 workspace_id = 1;
  optional uint64 tab_id = 2;
}

message Pong {
  uint64 server_id = 1;
  uint64 nonce = 2;
  uint64 sequence = 3;
}

message LayoutRejected {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint64 request_id = 3;
  string reason = 4;
}

message LayoutApplied {
  uint64 server_id = 1;
  uint64 session_id = 2;
  uint64 request_id = 3;
  uint64 sequence = 4;
  LayoutResult result = 5;
}

message LayoutResult {
  oneof result {
    Empty changed = 1;
    WorkspaceCreated workspace_created = 2;
    TabCreated tab_created = 3;
    PaneTarget pane_created = 4;
    WorkspaceTarget workspace_opened = 5;
    TabTarget diff_shown = 6;
    TabTarget file_shown = 7;
  }
}

message WorkspaceCreated {
  uint64 workspace_id = 1;
  uint64 tab_id = 2;
  uint64 pane_id = 3;
}

message TabCreated {
  uint64 tab_id = 1;
  uint64 pane_id = 2;
}

message TerminalCopied {
  uint64 pane_id = 1;
  optional string text = 2;
}

message PaneText {
  uint64 pane_id = 1;
  string text = 2;
}

message GitDiffReply {
  uint64 request_id = 1;
  uint64 workspace_id = 2;
  string path = 3;
  oneof result {
    FileDiff ok = 4;
    string err = 5;
  }
}

message DirectoryReply {
  uint64 request_id = 1;
  uint64 workspace_id = 2;
  string path = 3;
  oneof result {
    DirectoryListing ok = 4;
    string err = 5;
  }
}

message BrowsedDirectory {
  string path = 1;
  optional string parent = 2;
  // Directories only.
  DirectoryListing listing = 3;
}

message BrowsedDirectoryReply {
  uint64 request_id = 1;
  oneof result {
    BrowsedDirectory ok = 2;
    string err = 3;
  }
}

message FileContentReply {
  uint64 request_id = 1;
  uint64 workspace_id = 2;
  string path = 3;
  oneof result {
    FileContent ok = 4;
    string err = 5;
  }
}

message AgentInstallations {
  repeated AgentInstallation installations = 1;
}

message AgentInfo {
  uint64 pane_id = 1;
  optional string name = 2;
  AgentSnapshot agent = 3;
  bool launch_pending = 4;
}

message AgentInfos {
  repeated AgentInfo agents = 1;
}

message AgentResponse {
  oneof response {
    AgentInstallations available = 1;
    AgentInfos list = 2;
    AgentInfo ready = 3;
    HooksReport hooks = 4;
  }
}

message AgentError {
  string code = 1;
  string message = 2;
}

message AgentResult {
  oneof result {
    AgentResponse ok = 1;
    AgentError err = 2;
  }
}

message ConnectedDevices {
  repeated string keys = 1;
}

message ServerLogRecord {
  uint64 at = 1;
  string level = 2;
  string message = 3;
}

message ServerClientInfo {
  string name = 1;
  string fingerprint = 2;
  uint64 last_seen = 3;
}

message ServerStatus {
  optional string listen = 1;
  bool p2p = 2;
  repeated string connected = 3;
  string version = 4;
  uint64 uptime_secs = 5;
  uint32 workspaces = 6;
  uint32 tabs = 7;
  uint32 panes = 8;
  uint32 agents = 9;
  uint32 clients = 10;
  repeated ServerLogRecord recent_errors = 11;
}

message ServerClients {
  repeated ServerClientInfo clients = 1;
  repeated string connected = 2;
}

message ServerInvite {
  optional string tcp = 1;
  optional string p2p = 2;
  uint64 expires_in_secs = 3;
}

message ServerAdminResponse {
  oneof response {
    ServerStatus status = 1;
    SaveListen listen_saved = 2;
    bool p2p_saved = 3;
    ServerClients clients = 4;
    ServerInvite invite = 5;
    uint32 revoked = 6;
  }
}
