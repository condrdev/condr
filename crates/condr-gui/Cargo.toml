[package]
name = "condr-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "condr-gui"
path = "src/main.rs"

[features]
test-support = ["gpui-kit/test-support"]

[dependencies]
async-channel.workspace = true
# Every grammar GPUI Kit ships except SQL: tree-sitter-sequel pins cc 1.2, which the
# Windows resource embedding already needs newer.
gpui-kit = { workspace = true, features = ["tree-sitter-astro", "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cmake", "tree-sitter-cpp", "tree-sitter-csharp", "tree-sitter-css", "tree-sitter-diff", "tree-sitter-ejs", "tree-sitter-elixir", "tree-sitter-erb", "tree-sitter-go", "tree-sitter-graphql", "tree-sitter-html", "tree-sitter-java", "tree-sitter-javascript", "tree-sitter-jsdoc", "tree-sitter-kotlin", "tree-sitter-lua", "tree-sitter-make", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-php", "tree-sitter-proto", "tree-sitter-python", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-scala", "tree-sitter-svelte", "tree-sitter-swift", "tree-sitter-toml", "tree-sitter-tsx", "tree-sitter-typescript", "tree-sitter-yaml", "tree-sitter-zig"] }
gpui-fps.workspace = true
image.workspace = true
condr-core = { path = "../condr-core" }
condr-server = { path = "../condr-server" }
relative-path.workspace = true
serde.workspace = true
smol_str.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
keepawake = { version = "0.6", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["ico"] }
resvg = { version = "0.46", default-features = false }

[lints]
workspace = true
