[package]
name = "condr-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "condr-gui"
path = "src/main.rs"

[features]
# The GUI's tests run a Server in process, Tasks and all (ADR 0068).
test-support = ["gpui-kit/test-support", "condr-server/tasks"]

[dependencies]
async-channel.workspace = true
gpui-kit.workspace = true
gpui-fps.workspace = true
gpui-pre-reqwest-client.workspace = true
gpui-pre-reqwest.workspace = true
gpui-pre-http-client-tls.workspace = true
futures-lite.workspace = true
similar.workspace = true
nucleo-matcher.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
image = { workspace = true, features = ["gif", "webp"] }
condr-core = { path = "../condr-core" }
condr-client = { path = "../condr-client" }
# Without the task store: the GUI never opens it (ADR 0068).
condr-server = { path = "../condr-server", default-features = false }
relative-path.workspace = true
syntect.workspace = true
two-face.workspace = true
serde.workspace = true
serde_json.workspace = true
prost.workspace = true
qrcode.workspace = true
smol_str.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
unicode-properties.workspace = true
keepawake = { version = "0.6", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["ico"] }
resvg = { version = "0.46", default-features = false }

[lints]
workspace = true
