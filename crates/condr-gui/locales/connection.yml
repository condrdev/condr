_version: 2
connection:
  advice:
    incompatible_protocol:
      en: Condr there and here are different versions. Update both to the same version.
      zh-CN: 两端的 Condr 版本不同，请将两端更新到同一版本。
    local_start_failed:
      en: The Condr server could not start on this device. Click Connect to try again.
      zh-CN: Condr 服务无法在这台设备上启动。请点击“连接”重试。
    ssh_not_running:
      en: SSH connected, but no Condr server was found. Run `condr server start` on the device.
      zh-CN: SSH 已连接，但未找到 Condr 服务。请在目标设备上执行启动命令 `condr server start`。
    nothing_listening:
      en: Nothing answers at this address. Check that the address is right and that the Condr server is running.
      zh-CN: 目标地址没有响应。请确认地址是否正确或 Condr 服务是否正常。
    no_answer:
      en: The device did not answer.
      zh-CN: 设备没有响应。
    unreachable:
      en: Cannot reach that address. Check the network and VPN settings.
      zh-CN: 无法访问目标地址。请检查网络和 VPN 设置。
    refused:
      en: The device refused the connection. Check that the devices are still paired.
      zh-CN: 对方拒绝了连接。请确认设备配对状态是否正常。
    closed:
      en: The device closed the connection. Check that the Condr server is running there.
      zh-CN: 对方关闭了连接。请检查 Condr 服务状态是否正常。
    ssh_failed:
      en: SSH could not connect. Check your SSH configuration.
      zh-CN: SSH 连接失败。请检查 SSH 连接配置。
    retry:
      en: Click Connect to try again.
      zh-CN: 点击“连接”进行重试。
  title:
    reconnecting:
      en: 'Reconnecting to %{device}…'
      zh-CN: '正在重新连接 %{device}…'
    connecting:
      en: 'Connecting to %{device}…'
      zh-CN: '正在连接 %{device}…'
    disconnected:
      en: 'Disconnected from %{device}'
      zh-CN: '已断开与 %{device} 的连接'
    unreachable:
      en: "Can't reach %{device}"
      zh-CN: '无法连接 %{device}'
  copy_error:
    en: Copy error
    zh-CN: 复制错误信息
  connect:
    en: Connect
    zh-CN: 连接
  edit_device:
    en: Edit device
    zh-CN: 编辑设备
