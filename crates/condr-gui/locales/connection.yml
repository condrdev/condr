_version: 2
connection:
  advice:
    incompatible_protocol:
      en: Condr there and here speak different protocol versions, so trying again will not help. Update both to the same version.
      zh-CN: 两端的 Condr 协议版本不同，重试也无济于事。请把两端更新到同一版本。
    local_start_failed:
      en: Condr's own server could not start on this device. Connect tries again.
      zh-CN: Condr 自己的服务无法在这台设备上启动。点击“连接”会再试一次。
    ssh_not_running:
      en: SSH reached the device, but Condr is not running there. Start it with `condr server start` on the device.
      zh-CN: SSH 已连上那台设备，但 Condr 没有在运行。在那台设备上用 `condr server start` 启动它。
    nothing_listening:
      en: Nothing answers at this address. Check that Condr is running there and that the address is right.
      zh-CN: 这个地址没有任何响应。确认 Condr 在那里运行，并且地址无误。
    no_answer:
      en: The device did not answer. Check that it is awake and on the network.
      zh-CN: 设备没有响应。确认它没有休眠并且已联网。
    unreachable:
      en: This device cannot reach that address. Check the network and any VPN.
      zh-CN: 这台设备无法访问那个地址。检查网络和 VPN。
    refused:
      en: The device refused this connection. Check that this device is still paired there.
      zh-CN: 对方设备拒绝了这次连接。确认这台设备仍与它配对。
    closed:
      en: The device closed the connection. Condr there may have stopped or restarted.
      zh-CN: 对方设备关闭了连接。那里的 Condr 可能已停止或重启。
    ssh_failed:
      en: SSH could not reach the device. Try the same `ssh` destination from a terminal on this device.
      zh-CN: SSH 无法连上那台设备。在这台设备的终端里试试同一个 `ssh` 目标。
    retry:
      en: Connect tries again. The reason below says what went wrong.
      zh-CN: 点击“连接”会再试一次。下方的原因说明了出错的地方。
  title:
    reconnecting:
      en: 'Reconnecting to %{device}…'
      zh-CN: '正在重新连接 %{device}…'
    connecting:
      en: 'Connecting to %{device}…'
      zh-CN: '正在连接 %{device}…'
    disconnected:
      en: 'Disconnected from %{device}'
      zh-CN: '已断开与 %{device} 的连接'
    unreachable:
      en: "Can't reach %{device}"
      zh-CN: '无法连接 %{device}'
  copy_error:
    en: Copy error
    zh-CN: 复制错误信息
  connect:
    en: Connect
    zh-CN: 连接
  edit_device:
    en: Edit device
    zh-CN: 编辑设备
