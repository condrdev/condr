[package]
name = "condr-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The shipped binary: `condr server …` runs the Server, the other subcommands are the CLI.
[[bin]]
name = "condr"
path = "src/main.rs"

# Windows only: what Autostart's login item runs, so no console window opens (ADR 0057).
[[bin]]
name = "condrw"
path = "src/bin/condrw.rs"

[features]
default = ["tasks"]
# The task store (ADR 0068): SQLite, which the `condr` binary carries and `condr-gui`'s
# own build leaves out. Without it the Server keeps no Tasks and refuses their requests.
tasks = ["dep:rusqlite"]

[dependencies]
atomicwrites.workspace = true
clap.workspace = true
interprocess.workspace = true
relative-path.workspace = true
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml_edit.workspace = true
condr-core = { path = "../condr-core" }
condr-client = { path = "../condr-client" }
netwatch.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["sync"] }
notify.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# A Task's id (ADR 0068), and unique names for temporary files.
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
prost.workspace = true

[build-dependencies]
dirs.workspace = true
embed-resource.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
widestring.workspace = true
windows-registry.workspace = true
windows-spawn.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
