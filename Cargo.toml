[workspace]
members = ["crates/condr-core", "crates/condr-server", "crates/condr-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/condrdev/condr"

[workspace.dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
async-channel = "2.5"
atomicwrites = "0.4.4"
bincode = "1.3"
filedescriptor = "0.8.3"
interprocess = "2.4.2"
nix = { version = "0.28.0", features = ["fs", "poll", "process"] }
# gpui-component follows Zed main; Cargo.lock pins this source to its reviewed commit.
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { version = "=0.1.0", git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "9890a77c2d427f05b2512f05ddc6cce84686f9a6" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "9890a77c2d427f05b2512f05ddc6cce84686f9a6" }
serde = { version = "1.0", features = ["derive"] }
smol_str = { version = "0.3.6", features = ["serde"] }
toml = "1.0"
portable-pty = "0.9.0"
sysinfo = "0.31.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "time"] }
widestring = "1.2"

[profile.dev]
codegen-units = 16
debug = "limited"

[profile.dev.package]
alacritty_terminal = { opt-level = 3 }
bincode = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
condr-core = { opt-level = 2 }
condr-gui = { opt-level = 2 }
condr-server = { opt-level = 2 }
rustybuzz = { opt-level = 3 }
smol_str = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[workspace.lints.rust]
unsafe_code = "forbid"
