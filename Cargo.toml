[workspace]
members = ["crates/condr-core", "crates/condr-server", "crates/condr-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/condrdev/condr"

[workspace.dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
async-channel = "2.5"
atomicwrites = "0.4.4"
clap = { version = "4.5", features = ["derive"] }
bincode = "1.3"
dirs = "6.0"
gix = { version = "0.87", default-features = false, features = ["sha1", "revision", "status", "worktree-mutation", "parallel"] }
embed-resource = "3.0.11"
filedescriptor = "0.8.3"
interprocess = "2.4.2"
nix = { version = "0.28.0", features = ["fs", "hostname", "poll", "process"] }
# GPUI Kit owns the matching GPUI, component, platform, and asset dependencies.
gpui-kit = "0.6"
gpui-fps = "0.6"
image = { version = "0.25.10", default-features = false, features = ["bmp", "png"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: hook installers rewrite the user's settings.json and must not reorder it.
serde_json = { version = "1.0", features = ["preserve_order"] }
smol_str = { version = "0.3.6", features = ["serde"] }
# Noise IKpsk2 for TCP endpoints; only the primitives that pattern needs.
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
getrandom = "0.3"
curve25519-dalek = { version = "4.1", default-features = false }
regex = "1"
toml = "1.0"
# Format-preserving writes, so a hand-edited config.toml keeps its comments.
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9.0"
sysinfo = "0.31.4"
tokio = { version = "1.53", features = ["rt-multi-thread", "time"] }
widestring = "1.2"
windows-spawn = "0.1.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }
windows-registry = "0.6"

[profile.dev]
codegen-units = 16
debug = "limited"

[profile.dev.package]
alacritty_terminal = { opt-level = 3 }
bincode = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-windows = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
condr-core = { opt-level = 2 }
condr-gui = { opt-level = 2 }
condr-server = { opt-level = 2 }
rustybuzz = { opt-level = 3 }
smol_str = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[workspace.lints.rust]
unsafe_code = "deny"
