[workspace]
members = ["crates/murmur-core", "crates/murmur-server", "crates/murmur-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/bcl-dev/murmur"

[workspace.dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
bincode = "1.3"
interprocess = "2.4.2"
# gpui-component follows Zed main; Cargo.lock pins this source to its reviewed commit.
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { version = "=0.1.0", git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "9890a77c2d427f05b2512f05ddc6cce84686f9a6" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "9890a77c2d427f05b2512f05ddc6cce84686f9a6" }
serde = { version = "1.0", features = ["derive"] }
portable-pty = "0.9.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "time"] }
widestring = "1.2"

[workspace.lints.rust]
unsafe_code = "forbid"
