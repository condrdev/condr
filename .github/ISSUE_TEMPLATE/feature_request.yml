name: Feature request
description: Suggest an improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Condr makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen? Alternatives you considered are welcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Which agent CLIs, platforms, or workflows this affects. Link to any related ADR in `docs/adr/`.
