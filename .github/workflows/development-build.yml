name: Development Build

on:
  push:
    tags:
      - dev

permissions:
  contents: read

concurrency:
  group: development-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.95.0

jobs:
  linux:
    name: Linux GUI, server and CLI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Build GUI and condr
        run: cargo build --release --locked -p condr-gui -p condr-server
      - name: Smoke test condr
        run: target/release/condr server --help
      - name: Package condr
        run: |
          short_sha="${GITHUB_SHA::12}"
          package="condr-linux-${{ matrix.arch }}-${short_sha}"
          mkdir -p dist/condr
          install -m 755 target/release/condr dist/condr/condr
          install -m 644 LICENSE dist/condr/LICENSE
          printf '%s\n' "$GITHUB_SHA" > dist/condr/BUILD-COMMIT
          tar -C dist -czf "dist/${package}.tar.gz" condr
          tool_arch="${{ matrix.arch }}"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${tool_arch}.AppImage" \
            --output appimagetool
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGE_TOOL="$PWD/appimagetool" \
            APPIMAGE_OUTPUT="dist/condr-linux-${{ matrix.arch }}-${short_sha}.AppImage" \
            CONDR_VERSION="$GITHUB_SHA" script/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: condr-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  windows-bundle:
    name: Windows GUI, server and CLI (x86_64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Build GUI and condr
        run: cargo build --release --locked -p condr-gui -p condr-server
      - name: Smoke test condr
        run: target\release\condr.exe server --help
      - name: Package GUI and condr
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $package = "condr-windows-x86_64-$shortSha"
          $stage = Join-Path "dist" "condr"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\release\condr-gui.exe" $stage
          Copy-Item "target\release\condr.exe" $stage
          Copy-Item "LICENSE" $stage
          Set-Content -Encoding ascii -Path (Join-Path $stage "BUILD-COMMIT") -Value $env:GITHUB_SHA
          Compress-Archive -Path $stage -DestinationPath "dist\$package.zip"
          $cliStage = Join-Path "dist" "condr-cli"
          New-Item -ItemType Directory -Force -Path $cliStage | Out-Null
          Copy-Item "target\release\condr.exe" $cliStage
          Copy-Item "LICENSE" $cliStage
          Set-Content -Encoding ascii -Path (Join-Path $cliStage "BUILD-COMMIT") -Value $env:GITHUB_SHA
          Compress-Archive -Path $cliStage -DestinationPath "dist\condr-windows-x86_64-$shortSha-cli.zip"
      - name: Build GUI installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $iscc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=0.1.0" "/DOutputBaseFilename=condr-windows-x86_64-$shortSha-setup" "packaging\condr.iss"
      - name: Copy installer script
        shell: pwsh
        run: Copy-Item script\install-condr.ps1 dist\install-condr.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: condr-windows-x86_64
          path: |
            dist/*.zip
            dist/*.exe
            dist/install-condr.ps1
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS GUI, server and CLI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Build GUI and condr
        run: cargo build --release --locked -p condr-gui -p condr-server
      - name: Package GUI and CLI
        run: |
          short_sha="${GITHUB_SHA::12}"
          mkdir -p dist/condr-cli
          install -m 755 target/release/condr dist/condr-cli/condr
          install -m 644 LICENSE dist/condr-cli/LICENSE
          printf '%s\n' "$GITHUB_SHA" > dist/condr-cli/BUILD-COMMIT
          tar -C dist -czf "dist/condr-macos-${{ matrix.arch }}-${short_sha}-cli.tar.gz" condr-cli
          CONDR_VERSION=0.1.0 MACOS_PKG_OUTPUT="dist/condr-macos-${{ matrix.arch }}-${short_sha}.pkg" \
            script/build-macos-pkg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: condr-macos-${{ matrix.arch }}
          path: |
            dist/*.pkg
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  install-scripts:
    name: Installer scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Stage installer scripts
        run: |
          mkdir -p dist
          cp script/install-condr.sh script/install-condr.ps1 dist/
      - uses: actions/upload-artifact@v7
        with:
          name: condr-install-scripts
          path: dist/install-condr.*
          retention-days: 1

  publish:
    name: Update rolling prerelease
    needs:
      - linux
      - windows-bundle
      - macos
      - install-scripts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify release assets
        run: |
          short_sha="${GITHUB_SHA::12}"
          test -f "dist/condr-windows-x86_64-${short_sha}.zip"
          test -f "dist/condr-linux-x86_64-${short_sha}.tar.gz"
          test -f "dist/condr-linux-aarch64-${short_sha}.tar.gz"
          test -f "dist/condr-linux-x86_64-${short_sha}.AppImage"
          test -f "dist/condr-linux-aarch64-${short_sha}.AppImage"
          test -f "dist/condr-windows-x86_64-${short_sha}-setup.exe"
          test -f "dist/condr-windows-x86_64-${short_sha}-cli.zip"
          test -f "dist/condr-macos-x86_64-${short_sha}.pkg"
          test -f "dist/condr-macos-arm64-${short_sha}.pkg"
          test -f "dist/condr-macos-x86_64-${short_sha}-cli.tar.gz"
          test -f "dist/condr-macos-arm64-${short_sha}-cli.tar.gz"
          test -f dist/install-condr.sh
          test -f dist/install-condr.ps1
          sha256sum dist/* > dist/SHA256SUMS
      - name: Publish Development Build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          notes="Rolling development build from commit \`${GITHUB_SHA}\`. This release and the \`dev\` tag are mutable; all platform installers are rebuilt together."

          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev dist/* --clobber
            gh release edit dev --title "Development Build" --notes "$notes" --prerelease --latest=false
          else
            gh release create dev dist/* --title "Development Build" --notes "$notes" --prerelease --latest=false
          fi

          while IFS= read -r asset; do
            case "$asset" in
            SHA256SUMS|install-condr.sh|install-condr.ps1) ;;
              *-"$short_sha"-*.*|*-"$short_sha".*) ;;
              *) gh release delete-asset dev "$asset" --yes ;;
            esac
          done < <(gh release view dev --json assets --jq '.assets[].name')
