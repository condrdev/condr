name: Development Build

on:
  push:
    tags:
      - dev

permissions:
  contents: read

concurrency:
  group: development-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.95.0

jobs:
  linux:
    name: Linux GUI, server and CLI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxkbcommon-x11-dev libwayland-dev libssl-dev libvulkan1 patchelf desktop-file-utils
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Build GUI and condr
        run: cargo build --release --locked -p condr-gui -p condr-server
      - name: Smoke test condr
        run: target/release/condr server --help
      - name: Install AppImage tooling
        run: |
          tool_arch="${{ matrix.arch }}"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${tool_arch}.AppImage" \
            --output appimagetool
          curl --fail --location --retry 3 \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${tool_arch}.AppImage" \
            --output linuxdeploy
          chmod +x appimagetool
          chmod +x linuxdeploy
      - name: Package Linux artifacts
        env:
          CONDR_COMMIT: ${{ github.sha }}
          CONDR_ARCH: ${{ matrix.arch }}
          APPIMAGE_TOOL: ${{ github.workspace }}/appimagetool
          LINUXDEPLOY_TOOL: ${{ github.workspace }}/linuxdeploy
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: script/package-linux.sh
      - name: Check Linux packages
        run: sh script/check-linux-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: condr-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  windows-bundle:
    name: Windows GUI, server and CLI (x86_64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Build GUI and condr
        run: cargo build --release --locked -p condr-gui -p condr-server
      - name: Smoke test condr
        run: target\release\condr.exe server --help
      - name: Package Windows artifacts
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $env:CONDR_COMMIT = $env:GITHUB_SHA
          & powershell -File script\package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: condr-windows-x86_64
          path: |
            dist/*.zip
            dist/*.exe
            dist/install-condr.ps1
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS GUI, server and CLI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: Build GUI and condr
        run: cargo build --release --locked -p condr-gui -p condr-server
      - name: Package macOS artifacts
        env:
          CONDR_COMMIT: ${{ github.sha }}
          CONDR_ASSET_ID: ${{ github.sha }}
          CONDR_ARCH: ${{ matrix.arch }}
        run: script/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: condr-macos-${{ matrix.arch }}
          path: |
            dist/*.pkg
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  install-scripts:
    name: Installer scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Stage installer scripts
        run: |
          mkdir -p dist
          cp script/install-condr.sh script/install-condr.ps1 dist/
      - uses: actions/upload-artifact@v7
        with:
          name: condr-install-scripts
          path: dist/install-condr.*
          retention-days: 1

  publish:
    name: Update rolling prerelease
    needs:
      - linux
      - windows-bundle
      - macos
      - install-scripts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Determine package version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "CONDR_VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify release assets
        run: |
          short_sha="${GITHUB_SHA::12}"
          test -f "dist/condr-windows-x86_64-${CONDR_VERSION}-${short_sha}.zip"
          test -f "dist/condr-linux-x86_64-${CONDR_VERSION}-${short_sha}-cli.tar.gz"
          test -f "dist/condr-linux-aarch64-${CONDR_VERSION}-${short_sha}-cli.tar.gz"
          test -f "dist/condr-linux-x86_64-${CONDR_VERSION}-${short_sha}.AppImage"
          test -f "dist/condr-linux-aarch64-${CONDR_VERSION}-${short_sha}.AppImage"
          test -f "dist/condr-windows-x86_64-${CONDR_VERSION}-${short_sha}-setup.exe"
          test -f "dist/condr-windows-x86_64-${CONDR_VERSION}-${short_sha}-cli.zip"
          test -f "dist/condr-macos-x86_64-${CONDR_VERSION}-${short_sha}.pkg"
          test -f "dist/condr-macos-arm64-${CONDR_VERSION}-${short_sha}.pkg"
          test -f "dist/condr-macos-x86_64-${CONDR_VERSION}-${short_sha}-cli.tar.gz"
          test -f "dist/condr-macos-arm64-${CONDR_VERSION}-${short_sha}-cli.tar.gz"
          test -f dist/install-condr.sh
          test -f dist/install-condr.ps1
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish Development Build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          notes="Rolling development build from commit \`${GITHUB_SHA}\`. This release and the \`dev\` tag are mutable; all platform installers are rebuilt together."

          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev dist/* --clobber
            gh release edit dev --title "Development Build" --notes "$notes" --prerelease --latest=false
          else
            gh release create dev dist/* --title "Development Build" --notes "$notes" --prerelease --latest=false
          fi

          while IFS= read -r asset; do
            case "$asset" in
              SHA256SUMS|install-condr.sh|install-condr.ps1) ;;
              *-"$short_sha"-*.*|*-"$short_sha".*) ;;
              *) gh release delete-asset dev "$asset" --yes ;;
            esac
          done < <(gh release view dev --json assets --jq '.assets[].name')
