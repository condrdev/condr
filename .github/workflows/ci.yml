name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['website/**']
  pull_request:
    paths-ignore: ['website/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      # The protocol contract (ADR 0028): pushes compare with the commit before, pull
      # requests with their base.
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          format: false
          breaking: true
          push: false

  test:
    name: clippy and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libfontconfig1-dev libfreetype6-dev libxcb1-dev libxkbcommon-x11-dev libwayland-dev libssl-dev libvulkan1
      - name: Use a long temp path on Windows
        if: runner.os == 'Windows'
        # The runner's TEMP is an 8.3 short path (RUNNER~1), which shells and the
        # process table report in its long form, so path comparisons in tests fail.
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          # PR branches only restore main's cache; saving per branch would evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --features condr-gui/test-support --locked -- -D warnings
      # Every test binary runs, so one run reports every failure.
      - run: cargo test --workspace --features condr-gui/test-support --locked --no-fail-fast
