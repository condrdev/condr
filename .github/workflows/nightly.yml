name: Nightly

# Every day `main` changes, package it for every platform and publish it to the
# mutable `nightly` prerelease. Nothing is built when `nightly` already points
# at HEAD. Can also be run on demand.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  plan:
    name: Check for new commits
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current=$(gh api "repos/${GH_REPO}/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          if [ "${GITHUB_EVENT_NAME}" = schedule ] && [ "$current" = "${GITHUB_SHA}" ]; then
            echo "nightly already points at ${GITHUB_SHA}; nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      release: false

  publish:
    name: Update the nightly prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: condr-dist
          path: dist
      - name: Move the nightly tag
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Nightly build of \`main\` at commit \`${GITHUB_SHA}\` ($(date -u +%Y-%m-%d)). This release and the \`nightly\` tag are mutable; all platform installers are rebuilt together. Client and Server must use the same build."

          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            gh release edit nightly --title "Nightly" --notes "$notes" --prerelease --latest=false
          else
            gh release create nightly dist/* --title "Nightly" --notes "$notes" --prerelease --latest=false
          fi

          while IFS= read -r asset; do
            if [ ! -f "dist/$asset" ]; then
              gh release delete-asset nightly "$asset" --yes
            fi
          done < <(gh release view nightly --json assets --jq '.assets[].name')
