name: Nightly

# Every day `main` changes, package it for every platform and publish it to the
# mutable `nightly` prerelease. Nothing is built when `nightly` already points
# at HEAD. Can also be run on demand.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  plan:
    name: Check for new commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current=$(gh api "repos/${GH_REPO}/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          if [ "${GITHUB_EVENT_NAME}" = schedule ] && [ "$current" = "${GITHUB_SHA}" ]; then
            echo "nightly already points at ${GITHUB_SHA}; nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      release: false

  publish:
    name: Update the nightly prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The whole history and every tag, so git-cliff finds the latest release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write the changes since the latest release
        uses: orhun/git-cliff-action@v4
        with:
          args: --unreleased --strip header --output changes.md
      - uses: actions/download-artifact@v8
        with:
          name: condr-dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          {
            echo "Nightly build of \`main\` at commit \`${GITHUB_SHA}\` ($(date -u +%Y-%m-%d)). This release and the \`nightly\` tag are mutable; all platform installers are rebuilt together. Client and Server must use the same build."
            echo
            echo "Changes since ${latest}; [every commit](https://github.com/${GH_REPO}/compare/${latest}...${GITHUB_SHA})."
            cat changes.md
          } > notes.md

          # GITHUB_TOKEN may not push a tag at a commit that touches .github/workflows,
          # so let the Releases API create the tag instead of git push.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" \
            --title "Nightly" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
