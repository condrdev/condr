name: Release

# Pushing an immutable `v*` tag builds that commit for every platform and
# publishes a versioned release marked Latest.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag against Cargo.toml
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          }

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      release: true

  publish:
    name: Create the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The whole history and every tag, so git-cliff finds the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write the release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output release-notes.md
      - uses: actions/download-artifact@v8
        with:
          name: condr-dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONDR_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; tags are immutable" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Condr $CONDR_VERSION" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest

  website:
    name: Point condr.dev/download at the release
    needs: publish
    uses: ./.github/workflows/website.yml
    secrets: inherit
