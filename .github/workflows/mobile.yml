name: Mobile

# The Companion's apps around its library (ADR 0039): the bindings generate, the Swift
# package compiles against them, the iOS app's tests run on a simulator, and the Android app
# builds, lints and runs its unit tests (ADR 0048). ci.yml builds the library itself on every
# change.
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'crates/**', 'proto/**', 'script/build-mobile.sh', 'Cargo.toml', 'Cargo.lock']
  pull_request:
    paths: ['mobile/**', 'crates/**', 'proto/**', 'script/build-mobile.sh', 'Cargo.toml', 'Cargo.lock']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ios:
    name: iOS
    # iOS 26 (ADR 0042) needs a 26 SDK, which macos-26's default Xcode has.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: script/build-mobile.sh ios
      - name: Compile CondrKit for the simulator
        working-directory: mobile/ios/CondrKit
        run: xcodebuild -scheme CondrKit -destination 'generic/platform=iOS Simulator' build
      - name: Lint the app's Swift
        working-directory: mobile/ios
        run: xcrun swift-format lint --strict --recursive Condr CondrTests CondrUITests
      - uses: jdx/mise-action@v4
        with:
          install: false
      - name: Generate the app's project
        working-directory: mobile/ios
        run: mise exec xcodegen@2.46.0 -- xcodegen generate
      - name: Test the app on the simulator
        working-directory: mobile/ios
        # SwiftTerm ships a build plugin, which a command-line build must be told to trust.
        # Ad-hoc signing keeps the entitlements, which the Keychain test needs.
        run: >
          xcodebuild test -project Condr.xcodeproj -scheme Condr
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install the Android SDK packages the app compiles against
        run: |
          yes 2>/dev/null | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" >/dev/null
      # Gradle runs script/build-mobile.sh android before the app builds (ADR 0039).
      - name: Build, format-check, lint and unit-test the app
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:ktfmtCheck :app:lintDebug :app:testDebugUnitTest
