name: Website

# Builds website/ and uploads it to the Cloudflare Pages project `condr`
# (a Direct Upload project; it is not connected to GitHub). The install
# scripts come from script/ and the logo and agent marks from assets/, so
# changes there also redeploy the site. /download/ links to the files of the
# Cargo.toml version and /version.txt names it for the install scripts, so
# release.yml calls this once that release is published (a Cargo.toml push
# alone would point at files that do not exist yet).

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'assets/**'
      - 'script/install-condr.sh'
      - 'script/install-condr.ps1'
      - '.github/workflows/website.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy condr.dev
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      # main, not the triggering commit: a release tag can be older than the
      # site on main, and deploying it would roll the site back.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name condr --branch main --commit-hash "$(git rev-parse HEAD)"
